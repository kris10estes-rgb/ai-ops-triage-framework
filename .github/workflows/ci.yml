# Continuous integration for the AI Ops workspace.
#
# Runs the Support Triage Bot regression suite (03_operations_sprints/test_triage_router.py)
# on every push and pull request to main. Any failing test fails the job. To make failures
# block merges, require the "Regression tests (pytest)" check in main's branch protection rules.
#
# Local equivalent, from the workspace root:
#   python3 -m venv .venv
#   .venv/bin/python -m pip install --requirement 03_operations_sprints/requirements-dev.txt
#   .venv/bin/python -m pytest 03_operations_sprints -q

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only reads repository contents.
permissions:
  contents: read

# One active run per pull request: a new push cancels the outdated run.
# Pushes to main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"
  REQUIREMENTS_FILE: 03_operations_sprints/requirements-dev.txt
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regression-tests:
    name: Regression tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # Third-party actions are pinned to full commit SHAs; the comment records the release tag.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }} with pip cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.REQUIREMENTS_FILE }}

      # Put the venv first on PATH, so `python` in later steps runs inside .venv.
      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install test dependencies
        run: |
          python -m pip install --requirement "$REQUIREMENTS_FILE"
          python -m pip list

      - name: Verify virtual environment
        run: |
          python -c 'import sys; assert sys.prefix != sys.base_prefix, "python is not running inside .venv"; print(sys.executable); print(sys.version)'
          python -m pytest --version

      - name: Run regression suite
        run: python -m pytest 03_operations_sprints -q
