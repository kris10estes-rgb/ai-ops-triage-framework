[pytest]
# This file pins rootdir to 03_operations_sprints/, so the import path and cache
# location are the same whether pytest runs from the workspace root or this folder.
testpaths = .
python_files = test_*.py
# -ra: summarize every non-passing outcome; --strict-markers / --strict-config: fail on typos.
addopts = -ra --strict-markers --strict-config
xfail_strict = true
